name: Deploy to Cloudflare Workers (static assets)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production-workers' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Behavior tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Generated-site SEO checks
        run: npm run seo:check

      # seo:check already ran build:static; finish the asset bundle in ./out.
      - name: Prepare static asset bundle
        run: npm run cf:postbuild

      - name: Static assets smoke test
        run: npm run cf:smoke

      - name: Deploy static assets to Cloudflare Workers
        if: github.event_name != 'pull_request'
        run: npm run cf:deploy:artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
