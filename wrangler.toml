name = "wherewindsmeet-org"
main = "worker.mjs"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "wherewindsmeet.org/*", zone_name = "wherewindsmeet.org" },
  { pattern = "www.wherewindsmeet.org/*", zone_name = "wherewindsmeet.org" },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = false

[observability]
enabled = false
